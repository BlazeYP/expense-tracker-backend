spring.application.name=${SPRING_APPLICATION_NAME}

spring.data.mongodb.auto-index-creation=${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE}
spring.data.mongodb.uri=${MONGODB_URI}

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS}

server.port=${PORT}

app.timezone=${APP_TIMEZONE}
app.currency=${APP_CURRENCY}

# Keep the provider key in the environment, never in source control.
app.ai-categorization.enabled=${APP_AI_CATEGORIZATION_ENABLED}
app.ai-categorization.provider=${APP_AI_CATEGORIZATION_PROVIDER}
app.ai-categorization.base-url=${APP_AI_CATEGORIZATION_BASE_URL}
app.ai-categorization.api-key=${APP_AI_CATEGORIZATION_API_KEY}
app.ai-categorization.model=${APP_AI_CATEGORIZATION_MODEL}

app.ai-categorization.timeout-seconds=${APP_AI_CATEGORIZATION_TIMEOUT_SECONDS}
app.ai-categorization.max-batch-size=${APP_AI_CATEGORIZATION_MAX_BATCH_SIZE}

springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH}
